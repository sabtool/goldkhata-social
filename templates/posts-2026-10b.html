<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GoldKhata posts — late Oct / Nov 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=block">
<link rel="stylesheet" href="brand.css">
<style>
  /* the section named in the URL hash is the one rendered (render.sh passes #id) */
  .post:target { display: flex; }
  /* festival greeting (dasara): a marigold garland in CSS, no stock art */
  #dasara .art { flex-direction: column; justify-content: center; align-items: center; }
  .greet { width: 100%; }
  .garland { display: flex; justify-content: center; gap: 22px; margin: 10px 0 34px; }
  .mari { width: 92px; height: 92px; border-radius: 50%; position: relative; flex-shrink: 0;
          background: radial-gradient(circle at 50% 50%, #F5C542 0 22%, #E89A1C 23% 58%, #D4A017 59% 100%);
          box-shadow: 0 10px 26px rgba(0,0,0,.35), inset 0 0 0 6px rgba(255,255,255,.08); }
  .mari::after { content: ""; position: absolute; inset: 34%; border-radius: 50%; background: #B8860B; opacity: .9; }
  .mari.s { width: 64px; height: 64px; margin-top: 14px; }
  .greet { text-align: center; }
  .greet .big { font: 700 136px/1.04 "Playfair Display", serif; letter-spacing: -1px;
                background: linear-gradient(170deg, #F5C542, #B8860B); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .greet .big em { font-style: italic; }
  .greet .line { font: 500 36px/1.4 Inter; color: rgba(255,255,255,.84); margin-top: 26px; text-wrap: pretty; }
  .greet .from { font: 700 28px Inter; letter-spacing: .2em; text-transform: uppercase; color: #F5C542; margin-top: 34px; }
</style>
</head>
<body>

<!-- 1 · Dasara greeting · 20 Oct -->
<section class="post navy no-eyebrow" id="dasara">
  <header><img class="logo" src="brand/goldkhata-horizontal.png" alt="GoldKhata"></header>
  <div class="art">
    <div class="garland">
      <i class="mari s"></i><i class="mari"></i><i class="mari s"></i><i class="mari"></i><i class="mari s"></i><i class="mari"></i><i class="mari s"></i>
    </div>
    <div class="greet">
      <div class="big">Happy <em>Dasara</em></div>
      <div class="line">May Vijayadashami bring a busy counter,<br>a steady book and good fortune to your family.</div>
      <div class="from">Team GoldKhata</div>
    </div>
  </div>
  <footer><div class="cta"><div class="l1">Free for 30 days</div><div class="l2">Start your trial</div></div><div class="site">goldkhata.com</div></footer>
</section>

</body>
</html>
