<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GoldKhata brand images</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=block">
<link rel="stylesheet" href="brand.css">
<style>
  .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 36px; }
  .mid img.mark { width: 620px; }
  .mid img.round { width: 760px; }
  .tag { font: 500 40px/1.4 Inter, sans-serif; max-width: 820px; }
  .navy .tag { color: rgba(255,255,255,.85); }
  .cream .tag { color: #43536E; }
  .wordline { font: 700 44px Inter, sans-serif; letter-spacing: .02em; }
  .navy .wordline { color: #F5C542; }
  .cream .wordline { color: #8A6410; }
  #icon { padding: 0; }
  #icon::before { display: none; }
  #icon .mid { gap: 0; }
</style>
</head>
<body>

<section class="post navy" id="brand-navy">
  <div class="mid">
    <img class="mark" src="brand/goldkhata-horizontal.png" alt="GoldKhata">
    <p class="tag">Cloud software for gold loan firms. Runs on any phone.</p>
    <div class="wordline">goldkhata.com</div>
  </div>
</section>

<section class="post cream" id="brand-cream">
  <div class="mid">
    <img class="mark" src="brand/goldkhata-horizontal.png" alt="GoldKhata">
    <p class="tag">Pledges, payments, notices and jewellery sales in one place.</p>
    <div class="wordline">goldkhata.com</div>
  </div>
</section>

<section class="post navy" id="icon">
  <div class="mid"><img class="round" src="brand/goldkhata-circle.png" alt="GoldKhata"></div>
</section>

<script>
  const id = location.hash.slice(1) || "brand-navy";
  document.getElementById(id).style.display = "flex";
</script>
</body>
</html>
