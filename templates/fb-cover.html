<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GoldKhata — Facebook cover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=block">
<link rel="stylesheet" href="brand.css">
<style>
  html, body { width: 1640px; height: 624px; }
  /* Facebook crops the sides on phones: everything stays inside the middle ~1100px */
  .post { padding: 0; align-items: center; justify-content: center; text-align: center; }
  .post::before { inset: 26px; }
  .logo { height: 150px; margin: 0 auto; }
  .tag { font: 500 38px Inter, sans-serif; color: rgba(255,255,255,.85); margin-top: 34px; }
  .site { margin-top: 16px; }
</style>
</head>
<body>
<section class="post navy" id="cover">
  <img class="logo" src="brand/goldkhata-horizontal.png" alt="GoldKhata">
  <div class="tag">Gold loan software for your firm. Runs on any phone.</div>
  <div class="site">goldkhata.com</div>
</section>
<script>document.getElementById("cover").style.display = "flex";</script>
</body>
</html>
