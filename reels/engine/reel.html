<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GoldKhata reel renderer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=block">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0F1D33; }
  body { font-family: Inter, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; color: #fff; }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(1100px 900px at 85% 8%, rgba(212,160,23,.14), transparent 60%),
                radial-gradient(900px 900px at 10% 100%, rgba(212,160,23,.08), transparent 60%),
                linear-gradient(180deg, #152743 0%, #0F1D33 100%); }
  .scene { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
  .logo { position: absolute; top: 250px; left: 50%; transform: translateX(-50%); height: 58px; }

  /* hook + proof */
  .big { position: absolute; left: 90px; right: 90px; top: 600px; font: 700 118px/1.08 "Playfair Display", Georgia, serif; font-variant-numeric: lining-nums; }
  .big .w { display: inline-block; will-change: transform, opacity; }
  .big .accent { color: #F5C542; font-style: italic; }
  .kicker { position: absolute; left: 94px; top: 520px; font: 700 34px/1 Inter; letter-spacing: .2em; text-transform: uppercase; color: #F5C542; }
  .rule { position: absolute; left: 94px; height: 8px; width: 220px; border-radius: 4px; background: linear-gradient(90deg, #D4A017, #F5C542); transform-origin: 0 50%; }

  /* screen scenes */
  .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; will-change: transform; }
  .phone { position: absolute; left: 290px; top: 330px; width: 500px; height: 1060px; border-radius: 70px; background: #070D18; padding: 16px;
           box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 2px rgba(245,197,66,.25); }
  .scr { width: 468px; height: 1028px; border-radius: 56px; overflow: hidden; background: #fff; }
  .scr img { display: block; width: 468px; height: auto; }
  .dim { position: absolute; left: 306px; top: 346px; width: 468px; height: 1028px; border-radius: 56px; overflow: hidden; pointer-events: none; }
  .ring { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .ring rect { fill: none; stroke: #F5C542; stroke-width: 7; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 10px rgba(245,197,66,.8)); }
  .chip { position: absolute; left: 94px; top: 360px; padding: 16px 26px; border-radius: 999px; background: #F5C542; color: #12233F; font: 800 34px/1 Inter; letter-spacing: .02em; }

  /* illustrated card scenes */
  .cardwrap { position: absolute; left: 90px; right: 90px; top: 520px; }

  /* end card */
  .end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 40px; padding-bottom: 180px; }
  .end img { height: 120px; }
  .end .line { font: 700 76px/1.15 "Playfair Display", serif; max-width: 860px; }
  .end .line em { color: #F5C542; }
  .pill { background: linear-gradient(135deg, #F5C542, #D4A017); color: #12233F; border-radius: 34px; padding: 26px 48px; }
  .pill .l1 { font: 700 30px/1.3 Inter; letter-spacing: .12em; text-transform: uppercase; }
  .pill .l2 { font: 800 50px/1.2 Inter; }
  .site { font: 700 40px Inter; color: #F5C542; }

  /* captions: inside the safe band above Instagram's own caption area */
  #cap { position: absolute; left: 70px; right: 170px; top: 1440px; display: flex; justify-content: center; }
  #cap span.box { display: inline-block; max-width: 840px; padding: 18px 30px 22px; border-radius: 22px; background: rgba(9,17,31,.78);
                  font: 800 54px/1.22 Inter; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  #cap b { font-weight: 800; color: #fff; }
  #cap b.on { color: #F5C542; }
  #cap b.done { color: rgba(255,255,255,.92); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="cap"></div>
<script>
// Deterministic renderer: window.setup(spec) builds every scene once; window.renderAt(t) poses the
// whole reel for time t (seconds). No CSS transitions — frames are captured one by one.
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3));          // easeOutCubic
const easeIO = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const lerp = (a, b, k) => a + (b - a) * k;
const XF = 0.32;                                                                 // crossfade seconds
let SPEC, scenes = [], words = [];

const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const splitWords = (text, cls = '') => text.split(/(\s+)/).map((w) => (w.trim() ? `<span class="w ${cls}">${esc(w)}</span>` : w)).join('');

window.setup = (spec) => {
  SPEC = spec;
  const stage = document.getElementById('stage');
  words = spec.words || [];
  stage.innerHTML = '';
  scenes = spec.scenes.map((s) => {
    const el = document.createElement('div');
    el.className = 'scene';
    const logo = s.type === 'cta' ? '' : `<img class="logo" src="${spec.logo}">`;
    if (s.type === 'hook' || s.type === 'proof') {
      el.innerHTML = `${logo}${s.kicker ? `<div class="kicker">${esc(s.kicker)}</div>` : ''}
        <div class="big">${splitWords(s.text)}${s.accent ? ' ' + splitWords(s.accent, 'accent') : ''}</div>
        <div class="rule"></div>`;
    } else if (s.type === 'screen') {
      el.innerHTML = `${logo}<div class="cam"><div class="phone"><div class="scr"><img src="${s.shot}" style="transform:translateY(${-(s.scrollY || 0) * (468 / (s.shotWidth || 468))}px)"></div></div>
        <svg class="dim" viewBox="0 0 468 1028" preserveAspectRatio="none"><defs><mask id="m${s.i}"><rect width="468" height="1028" fill="white"/>
        <rect class="hole" rx="18" fill="black"/></mask></defs><rect width="468" height="1028" fill="rgba(7,13,24,.62)" mask="url(#m${s.i})"/></svg>
        <svg class="ring" width="1080" height="1920"><rect rx="20"/></svg></div>
        ${s.label ? `<div class="chip">${esc(s.label)}</div>` : ''}`;
    } else if (s.type === 'card') {
      el.innerHTML = `${logo}${s.label ? `<div class="chip">${esc(s.label)}</div>` : ''}<div class="cardwrap">${s.html}</div>`;
    } else if (s.type === 'cta') {
      el.innerHTML = `<div class="end"><img src="${spec.logo}"><div class="line">${s.line}</div>
        <div class="pill"><div class="l1">${esc(s.l1)}</div><div class="l2">${esc(s.l2)}</div></div><div class="site">goldkhata.com</div></div>`;
    }
    stage.appendChild(el);
    return { spec: s, el };
  });
  return document.fonts.ready.then(() => Promise.all([...document.images].map((im) => im.decode().catch(() => {}))));
};

// Screen geometry: the phone screen sits at (306, 346) and shows the shot scaled to 468 px wide.
const SCREEN = { x: 306, y: 346, w: 468 };

function poseScreen(sc, local, dur) {
  const s = sc.spec, el = sc.el;
  const k = s.shotWidth ? SCREEN.w / s.shotWidth : 1;                     // shot px → phone px
  const f = s.focus ? { x: SCREEN.x + s.focus.x * k, y: SCREEN.y + (s.focus.y - (s.scrollY || 0)) * k, w: s.focus.w * k, h: s.focus.h * k } : null;
  const zoomIn = easeIO(clamp01((local - 0.45) / 0.9));
  const S = f ? lerp(1, s.zoom || 1.9, zoomIn) : 1;
  const cx = 540, cy = 860;                                               // where the focus lands
  const fx = f ? lerp(540, f.x + f.w / 2, zoomIn) : 540, fy = f ? lerp(860, f.y + f.h / 2, zoomIn) : 860;
  const drift = 1 + 0.015 * (local / Math.max(dur, 1));                    // slow push-in keeps it alive
  el.querySelector('.cam').style.transform = `translate(${cx}px,${cy}px) scale(${S * drift}) translate(${-fx}px,${-fy}px)`;
  const hole = el.querySelector('.hole'), ring = el.querySelector('.ring rect'), dim = el.querySelector('.dim');
  if (f) {
    const pad = 12;
    hole.setAttribute('x', f.x - SCREEN.x - pad); hole.setAttribute('y', f.y - SCREEN.y - pad);
    hole.setAttribute('width', f.w + pad * 2); hole.setAttribute('height', f.h + pad * 2);
    const ringK = clamp01((local - 1.0) / 0.55);
    ring.setAttribute('x', f.x - pad); ring.setAttribute('y', f.y - pad);
    ring.setAttribute('width', f.w + pad * 2); ring.setAttribute('height', f.h + pad * 2);
    const per = 2 * (f.w + f.h + pad * 4);
    ring.style.strokeDasharray = per; ring.style.strokeDashoffset = per * (1 - ease(ringK));
    ring.style.opacity = ringK > 0 ? 1 : 0;
    dim.style.opacity = clamp01((local - 0.8) / 0.5);
  } else { ring.style.opacity = 0; dim.style.opacity = 0; }
  const chip = el.querySelector('.chip');
  if (chip) { const c = ease(clamp01((local - 0.15) / 0.45)); chip.style.opacity = c; chip.style.transform = `translateY(${(1 - c) * -24}px)`; }
}

function poseBig(sc, local) {
  sc.el.querySelectorAll('.big .w').forEach((w, i) => {
    const k = ease(clamp01((local - 0.12 - i * 0.07) / 0.5));
    w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * 60}px)`;
  });
  const big = sc.el.querySelector('.big'), rule = sc.el.querySelector('.rule');
  rule.style.top = `${big.offsetTop + big.offsetHeight + 44}px`;
  rule.style.transform = `scaleX(${ease(clamp01((local - 0.5) / 0.6))})`;
  const kick = sc.el.querySelector('.kicker');
  if (kick) kick.style.opacity = ease(clamp01(local / 0.4));
}

function poseCard(sc, local) {
  const c = ease(clamp01((local - 0.1) / 0.6));
  const w = sc.el.querySelector('.cardwrap');
  w.style.opacity = c; w.style.transform = `translateY(${(1 - c) * 80}px) scale(${0.96 + 0.04 * c})`;
  const chip = sc.el.querySelector('.chip');
  if (chip) { const k = ease(clamp01(local / 0.45)); chip.style.opacity = k; }
}

function poseEnd(sc, local) {
  [...sc.el.querySelectorAll('.end > *')].forEach((n, i) => {
    const k = ease(clamp01((local - i * 0.12) / 0.5));
    n.style.opacity = k; n.style.transform = `translateY(${(1 - k) * 40}px)`;
  });
}

window.renderAt = (t) => {
  for (const sc of scenes) {
    const { start, end } = sc.spec;
    // Phone-to-phone is a cut (a dissolve would show two phones at once); other joins dissolve.
    const xin = sc.spec.xfIn ?? XF, xout = sc.spec.xfOut ?? XF;
    const vis = t >= start - xin && t < end + xout;
    if (!vis) { sc.el.style.opacity = 0; continue; }
    const fadeIn = xin ? clamp01((t - (start - xin)) / xin) : (t >= start ? 1 : 0);
    const fadeOut = xout ? 1 - clamp01((t - end) / xout) : (t < end ? 1 : 0);
    const a = Math.min(sc.spec.i === 0 ? 1 : fadeIn, sc.spec.i === scenes.length - 1 ? 1 : fadeOut);
    sc.el.style.opacity = a;
    sc.el.style.transform = `scale(${xin ? 1.025 - 0.025 * ease(fadeIn) : 1})`;
    const local = t - start, dur = end - start;
    if (sc.spec.type === 'screen') poseScreen(sc, local, dur);
    else if (sc.spec.type === 'card') poseCard(sc, local);
    else if (sc.spec.type === 'cta') poseEnd(sc, local);
    else poseBig(sc, local);
  }
  // Captions: the phrase around the word being spoken, that word in gold.
  const cap = document.getElementById('cap');
  const idx = words.findIndex((w) => t >= w.start && t < w.end + 0.25);
  if (idx < 0 || (SPEC.scenes.find((s) => t >= s.start && t < s.end) || {}).noCaption) { cap.innerHTML = ''; return; }
  const ph = words[idx].phrase;
  const inPh = words.filter((w) => w.phrase === ph);
  cap.innerHTML = `<span class="box">${inPh.map((w) => `<b class="${w === words[idx] ? 'on' : t >= w.end ? 'done' : ''}">${esc(w.text)}</b>`).join(' ')}</span>`;
};
</script>
</body>
</html>
